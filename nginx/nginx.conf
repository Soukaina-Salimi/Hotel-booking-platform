events {}

http {
    # --------------------------------------------------------------------
    # Routing par prefixe d'URL vers chaque microservice.
    # Chaque service Laravel ecoute en interne sur le port 9000 (php-fpm)
    # ou 8000 (serveur artisan) selon le Dockerfile - voir services/*/docker/Dockerfile
    # --------------------------------------------------------------------

    upstream auth_service {
        server auth-service:8000;
    }
    upstream hotel_service {
        server hotel-service:8000;
    }
    upstream booking_service {
        server booking-service:8000;
    }
    upstream chat_service {
        server chat-service:8000;
    }
    # Limite de debit basique sur les routes sensibles (login, paiement).
    # Doit etre declaree ici, au niveau du bloc http - Nginx interdit
    # limit_req_zone a l'interieur d'un bloc server.
    limit_req_zone $binary_remote_addr zone=sensitive_zone:10m rate=10r/m;

    server {
        listen 80;

        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auth/login {
            limit_req zone=sensitive_zone burst=5 nodelay;
            proxy_pass http://auth_service;
        }
        location = /api/hotels {
            proxy_pass http://hotel_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/hotels/ {
            proxy_pass http://hotel_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M; # upload de photos d'hotel

        }

        location = /api/rooms {
            proxy_pass http://hotel_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/rooms/ {
            proxy_pass http://hotel_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M; # upload de photos de chambre
        }

        location /storage/ {
            proxy_pass http://hotel_service;
            proxy_set_header Host $host;
            client_max_body_size 10M;
        }

        location = /api/bookings {
            proxy_pass http://booking_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /api/bookings/ {
            proxy_pass http://booking_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/chat/ {
            proxy_pass http://chat_service;
            proxy_set_header Host $host;
        }
       

        location / {
            return 404 "Route API inconnue\n";
        }
    }
}